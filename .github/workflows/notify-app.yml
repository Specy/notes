name: Notify app of content change

# On every push to main, tell the app repo (Specy/learn) to bump its submodule
# pointer to this new commit, which triggers a rebuild/redeploy of learn.specy.app.
on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch content-updated to Specy/learn
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer ${{ secrets.APP_REPO_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Specy/learn/dispatches \
            -d '{"event_type":"content-updated"}'
